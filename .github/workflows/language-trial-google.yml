# Scores Google Speech-to-Text (EU servers) on the same public recordings as the Meta trial (tools/language-trial).
# Signs in to Google without a key: GitHub's own sign-in is exchanged through workload identity federation
# (project "development", pool github, provider verbaflow; only this repository is allowed) for the service
# account verbaflow-trial, which has the role Cloud Speech Client. A trial only: nothing here is part of VerbaFlow itself. Costs well under $1 a run.
name: Language trial (Google)
on:
  workflow_dispatch:
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        lang: [xho, sot, tsn, nso, tso, ssw, ven]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/521123430987/locations/global/workloadIdentityPools/github/providers/verbaflow
          service_account: verbaflow-trial@cs-project-0xzelowp.iam.gserviceaccount.com
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libsndfile1
          pip install -q jiwer soundfile remotezip google-auth requests
      - name: Run
        env:
          ENGINE: google
          GOOGLE_PROJECT: cs-project-0xzelowp
        run: |
          python tools/language-trial/trial.py ${{ matrix.lang }} result-${{ matrix.lang }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.lang }}
          path: result-${{ matrix.lang }}.json
          if-no-files-found: ignore
  summary:
    needs: trial
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - run: python tools/language-trial/summarise.py results | tee -a "$GITHUB_STEP_SUMMARY"
