# Scores Meta's free Omnilingual speech model on public recordings of the South African languages Azure cannot
# transcribe (tools/language-trial). A trial only: nothing here is part of VerbaFlow itself.
name: Language trial
# Run by hand only (Actions > Language trial > Run workflow): it takes about three hours.
on:
  workflow_dispatch:
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lang: [xho, sot, tsn, nso, tso, ssw, ven, nbl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libsndfile1
          # CPU-only torch, and fairseq2 built for that same torch (the default wheels expect a graphics card)
          pip install -q torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q fairseq2 --extra-index-url https://fair.pkg.atmeta.com/fairseq2/whl/pt2.8.0/cpu
          pip install -q omnilingual-asr "pyarrow==21.0.0" jiwer soundfile remotezip --extra-index-url https://fair.pkg.atmeta.com/fairseq2/whl/pt2.8.0/cpu
          pip list 2>/dev/null | grep -iE "^(torch|torchaudio|fairseq2|fairseq2n|omnilingual)" 
      - name: Run
        run: python tools/language-trial/trial.py ${{ matrix.lang }} result-${{ matrix.lang }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.lang }}
          path: result-${{ matrix.lang }}.json
          if-no-files-found: ignore
  summary:
    needs: trial
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - run: python tools/language-trial/summarise.py results | tee -a "$GITHUB_STEP_SUMMARY"
